*---------------------------------------------------------------*
*  Configuración específica para dispositivos Verifone
* modelo: 
*	Determina el modelo del dispositivo. Sus posibles
*	valores son: EVO, ENGAGE
* puerto : 
*	Establece el tipo de puerto del dispositivo
*	Verifone. Sus posibles valores son: USB, RS232
* comandosNuevos : 
*	Especifica si se usarán los nuevos comandos de
*	Verifone.
*	0: desactivado (Se usan comandos antiguos)
*	1: activado (Se usan comandos nuevos)
* tipoPinblock: 
*	Determina el tipo de encriptación. Sus posibles
*	valores son: TRIPLEDES, DUKPT
* dataSensibleEncriptada: 
*	Establece si será encriptada o no la data
*	sensible. 0: No encripta. 1: Sí encripta.
*---------------------------------------------------------------*
[pinpad-verifone]
modelo=ENGAGE
comandosNuevos=0
tipoPinblock=TRIPLEDES
mantenerConexion=1

[pinpad-datos]
datos=
                   
