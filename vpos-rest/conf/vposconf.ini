*---------------------------------------------------------------*
* Definicion del formato impresion de campos monto
*
* activo
*	Activa o desactiva el formato especificado para
*	los montos en la respuesta de VPos
*	0: Desactivado. 1: Activado
* formatoMontoTrx: 
*	Especifica el formato que tendrán los montos de 
*	transacciones en la respuesta de VPos.
* formatoMontoDivisa: 
*	Especifica el formato que tendrán los montos en
*	divisa en la respuesta de VPos.
*	
*	#: Dígito del monto
*	0: Dígito del monto que será mostrado como 0 en caso de 
*	   que no esté presente
*	[SD]: Separador decimal.
*	[SM]: Separador de miles 
*
* miles:
*	Caracter usado para representar el separador de miles. 
*	No debe ser igual a decimales. Posible valores: , .
* decimales:
*	Caracter usado para representar el separador decimal. 
*	No debe ser igual a miles. Posible valores: , .
*---------------------------------------------------------------*
[moneda]
activo=0
formatoMontoTrx=###[SM]###[SM]###[SM]##0[SD]00
formatoMontoDivisa=###[SM]###[SM]###[SM]##0[SD]00
miles=.
decimales=,
nombre=

