*---------------------------------------------------------------*
*  Tipo de Moneda para pago con P2C
*---------------------------------------------------------------*
[parmMonedaP2C]
monedaP2C=VES,USD,EUR
monedaP2CValor=10,40,90
*---------------------------------------------------------------*
*	Tipo de moneda usada en C@mbio P2C
*     tipoMonedaO2D=Prepago Bs.,Prepago Dolares,Prepago Euros
*     tipoMonedaO2DValor=5,4,9
*---------------------------------------------------------------*
[parmO2DVuelto]
tipoMonedaO2D=VES,EUR,USD
tipoMonedaO2DValor=928,978,840
*--------------------------------------------------------------*
* Indicador de campo editable Tipo de Moneda
* para transacciones de C@mbio P2C
* active : 
*	0 : no editable
*   	1 : editable
*--------------------------------------------------------------*
[monedaP2CVuelto]
active=0
* ----------------------------------------------------- *
* Bancos Destino para la Trx P2C                        *
*                                                       *
*  cant    : cantidad de bancos/tlf registrados         *
*  cantVisible: cantidad de bancos/tlf que se muestra a *
*         la vez en pantalla. NOTA: configurar un número*
*         muy alto puede ocasionar que el formulario no *
*         se muestre correctamente.                     *
*  acqcodeTlfp2cX : CODIGO_BANCO,NOMBRE_BANCO TELEFONO  *
*  CODIGO_BANCO   -- Codigo de Adquiriente              *
*  BANCO-TELEFONO --                                    *
*    NOMBRE_BANCO -- Texto a mostrar en la lista        *
*                    - (separador)                      *
*    TELEFONO --     Codigo de Area                     *
*                    - (separador)                      *
*                    Numero de Telefono                 *
* 0000#00000000000,xxxxx - 0000-0000000                 *
* ------------------------------------------------------*
[acqcodeTlfp2c]
cant=1
cantVisible=5
acqcodeTlfp2c1=0000#00000000000,xxxxx - 0000-0000000
*--------------------------------------------------------------*
* Indicador para activar o desactivar campo OTP en P2C
*--------------------------------------------------------------*
[parmOTPP2C]
required=0
active=0
*--------------------------------------------------------------*
* Indicador para habilitar la modificación de moneda de pago en P2C
*--------------------------------------------------------------*
[monedaPagoP2C]
active=1

