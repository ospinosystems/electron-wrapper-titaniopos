*--------------------------------------------------------------*
* Color del formulario
*sirve para el fondo de los formulario y las etiquetas de los campos
*background-color: Color de fondo para todos los formularios
*font-color: Color de las fuentes del formulario
*border-color: Color del borde del formulario
*--------------------------------------------------------------*
[formulario]
background-color=#FFFFFF
font-color=#000000
border-color=#000000
*--------------------------------------------------------------*
* Fuente del formulario
*font: fuente general del formulario
*--------------------------------------------------------------*
[fuentes]
font=Arial
*--------------------------------------------------------------*
* Botones del formulario Aceptar/Cancelar
*btn-color-cancelar: Color principal para el boton cancelar
*btn-color-cancelar-hover: Color cuando el mouse se encuentre
* sobre el boton cancelar
*btn-color-cancelar-font: Color de la fuente del boton cancelar
*btn-color-aceptar: Color principal para el boton aceptar
*btn-color-aceptar-hover: Color cuando el mouse se encuentre
* sobre el boton aceptar
*btn-color-aceptar-font: Color de la fuente del boton aceptar
*--------------------------------------------------------------*
[botones]
btn-color-cancelar=#BFBFBF
btn-color-cancelar-hover=#A0A0A0
btn-color-cancelar-font=#444444

btn-color-aceptar=#4B6277
btn-color-aceptar-hover=#405568
btn-color-aceptar-font=#FFFFFF

*--------------------------------------------------------------*
* Tamaño fuente del formulario
*font-size-titulo-ventana: titulo principal del formulario,
*nombre de la transaccion
*font-size-titulo-formulario: Titulo secundario del formulario
*font-size-campo: por habilitar
*font-size-btn-aceptar: por habilitar
*font-size-btn-cancelar: por habilitar
*--------------------------------------------------------------*
[font-size]
font-size-titulo-ventana=12
font-size-titulo-formulario=20
font-size-campo=12
font-size-ampliado=16
font-size-btn-aceptar=12
font-size-btn-cancelar=12


font-size-etiqueta=12
