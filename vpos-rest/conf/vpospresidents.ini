*---------------------------------------------------------------*
* Tiempo limite de inactividad en la captura de datos.
*	timerTransacripcion expresado en segundo
*	timerEsperaBanco expresado en minutos
*	timerEsperaRespuesta expresado en segundo
*	Repeticiones en ocurrencias de la accion
*---------------------------------------------------------------*
[timerInactividadTransaccion]
timerTransacripcion=30
timerEsperaBanco=10
repeticionEsperaBanco=2
timerEsperaRespuesta=30
repeticionEsperaRespuesta=3

*---------------------------------------------------------------*
* Tipos de Identificacion en los dialogos
*---------------------------------------------------------------*
[tipoIdentificacion]
0,V : Venezolano
3,E : Extranjero
2,P : Pasaporte
1,J : Jurídico
4,G : Gobierno
5,C : Comuna
6,R : Firma Personal

*-------------------------------------------------*
* Tipo de Moneda.
*-------------------------------------------------*
[tipoMoneda]
cant=3
tipoMoneda1=0,VES
tipoMoneda2=840,USD
tipoMoneda3=978,EUR

*-------------------------------------------------*
* Tipo de Productos
*-------------------------------------------------*
[tipoProducto]
cant=6
tipoProducto1=900,Banplus Pay Bolivares
tipoProducto2=720,Banplus Pay Dolar
tipoProducto3=563,Vuelto Dolar
tipoProducto4=654,GiftCard Dolar
tipoProducto5=652,Vale Dolar
tipoProducto6=700,Banplus Pay Euro

*-------------------------------------------------*
* Textos asociados:
* - Formulario Timer de Banco
* - Imagen de Ejecucion de Confirmacion
*-------------------------------------------------*
