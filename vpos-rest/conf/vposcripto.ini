[vigenciaVersion]
fecha=10/06/2026 16:57
 
*---------------------------------------------------------------*
* Tiempo limite de inactividad en la captura de datos.
*	timerTransacripcion expresado en segundo
*	timerEsperaRespuesta expresado en segundo
*	timerEsperaWallet expresado en minutos
*	Repeticiones en ocurrencias de la accion
*---------------------------------------------------------------*
[timerInactividadTransaccion]
timerTransacripcion=30
timerEsperaWallet=3
repeticionEsperaWallet=2
timerEsperaRespuesta=30
repeticionEsperaRespuesta=3

*-------------------------------------------------*
* Tipo de Moneda.
*-------------------------------------------------*
[tipoMoneda]
cant=1
tipoMoneda1=VES,Bs.F
tipoMoneda2=USD,Dolar

*-------------------------------------------------*
* Tipo de Criptomoneda.
*-------------------------------------------------*
[tipoCriptomoneda]
fechaActualizacion=
tipoCriptomoneda=

*-------------------------------------------------*
* Textos asociados:
* - Formulario Timer de Wallet
* - Imagen de Ejecucion de Confirmacion
*-------------------------------------------------*
[template-formularios]
templateMostrarQR=Indique|al|Cliente|que|debe|tomar|una|foto|del|QR<LF>y|enviarlo|al|Wallet para efectuar la compra.<LF><LF>
templateTimerInactividadWallet=El|tiempo|de|espera|de|la|respuesta|del|Cliente<LF>se|ha|consumido.<LF><LF>Si desea continuar esperando, pulse Continuar<LF>Si no hay respuesta del Cliente, pulse Terminar<LF>
templateProcesandoConfirmacion=Estamos|confirmando|el|Pago|realizado<LF>por|el|Cliente.<LF>Por favor|espere|hasta|obtener|la|respuesta<LF>del|Wallet.<LF><LF>
rutaIconProcesandoConfirmacion=./conf/Imagenes/ProcesandoConfirmacion.gif

