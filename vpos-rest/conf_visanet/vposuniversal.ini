*---------------------------------------------------------------*
* Size de CVV: la especificación de solapar el size del CVV de
*   los Bundles para validación de longitud de campo capturados
*   en los paneles de negocio, dependiendo de una aplicacion:
*   Master,Visa, Amex
* Formato: binX=campo,YY
* Valores:
*		X: secuencia del campo
*      	campo: aplicación a parametrizar
*			Ejemplo: Master, Visa, Amex, Diners
*      	bin: valor del bin
*			Ejemplo: Master: 5, Visa: 4, Amex: 37, Diners: 36
*     	YY: size a asignar
*			3 o 4
*---------------------------------------------------------------*
[sizeCodigoSeguridad]
cantBines=2
bin1=Amex,34,4
bin2=Amex,37,4

*---------------------------------------------------------------*
* Procesadora que acepta transacciones de Credito Financiado
* Formato:
*	procesadora=
*   	tipo de proceso,
*		indicador de emitir solo voucher original
*   	indicador de uso de Cuotas en Consulta,
*   	indicador de uso de Planes de Banco en Compra,
*		indicador de Monto Autorizado para cambio de Monto Trx,
*		indicador de Consulta previa antes de autorizar,
*       codigo Trx para Renglon Especifico en reporte de Cierre
* Valores:
*		X: secuencia de la procesadora
*       procesadora: nombre de la procesadora
*			Ejemplo: PLATCO
*      	nombre del flujo
*			Valores: SECUENCIA, INDEPENDIENTE
*			SECUENCIA: 1.- Consulta 2.- Compra
*			INDEPENDIENTE: 1.- Submenu 2.- Consulta o Compra
*		Para indicador emision solo del Voucher Original
*		0 : no aplica
*	    1 : aplica
*		Para los otros Indicadores:
*			0 --> inactivo el proceso asociado
*			1 --> activo el proceso asociado
*       codigo Trx
*			Ejemplo: BANESCO : 240
*---------------------------------------------------------------*
[procesadoras-creditoFinanciado]
cantProcesadoras=1
procesadora1=VISANET,SUBMENU,1,1,0,0,1

*---------------------------------------------------------------*
* Bancos asociado una procesadora
* Formato: procesadora=banco
* Valores:
*      	nombre: nombre del banco
*			Ejemplo: MERCANTIL, BBVA PROVINCIAL
*       procesadora: nombre de la procesadora
*			Ejemplo: PLATCO
*      	payment: nombre del payment a utilizar
*			Ejemplo: P-PlatcoMercantil, P-PlatcoProvincial
*		Para indicador si la opcion esta activa
*		0 : inactiva
*	    1 : activa
* Nota: el nombre debe ser igual al colocado en la seccion
*     	Asociacion Payment System - Banco --> [payments]
* El banco Visanet esta en este archivo como muestra como se
* configura Compra con financiamiento de Visanet
*---------------------------------------------------------------*
[procesadora-banco]
cantBancos=1
banco1=VISANET,VISANET,,1

