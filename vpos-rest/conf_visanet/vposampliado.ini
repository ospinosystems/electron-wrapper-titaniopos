
*--------------------------------------------------------------*
* Posicion por defecto de las ventanas
*--------------------------------------------------------------*
[posicion]
top=360
left=200

*--------------------------------------------------------------*
*  Parametros generales
*--------------------------------------------------------------*
[general]
factor=15

*--------------------------------------------------------------*
*  Size de Botones
*--------------------------------------------------------------*
[sizeControles]
botonWidth=120
botonHeight=60
comboWidth=0
comboHeight=20

*--------------------------------------------------------------*
* Font y Factor que seran base para el modo ampliado
*	font : solapara todos los objetos menos el Dialogo
*	factor: se sumara el Size defecto: 12. Rango: 0-9.
*--------------------------------------------------------------*
[font-factorsize]
font=Arial
factor=3

*--------------------------------------------------------------*
*  Imagenes generales de la aplicacion
*--------------------------------------------------------------*
[imagenes]
deslizarTarjeta=./conf/Imagenes/DesliceTarjeta.jpg
