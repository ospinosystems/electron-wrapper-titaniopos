	<script type="text/javascript">
		function metodosVirtual(metodoEjecutar){
			
			document.getElementById("respuesta").value =  "";

    		var pan;

    		var montoCompra;

			//alert("He invocado un metodo VPOS REST : " + metodoEjecutar);			
			if (metodoEjecutar == 'consultaDeCardsPrepago' || metodoEjecutar == 'consultarPuntosTVirtual') {
				if (document.getElementById("datos").elements.item(0).value !== "Tipo de Identificacion"){
					cedula = document.getElementById("datos").elements.item(0).value;
				}			
				cedula = cedula + document.getElementById("datos").elements.item(1).value;
				pan = document.getElementById("datos").elements.item(3).value;
    			dataObj = {
    					"accion":metodoEjecutar,
    					"cedula": cedula,
    					"numeroTarjeta": pan
    			}
    			if (document.getElementById("datos").elements.item(2).value !== ""){
    				dataObj.vtId = document.getElementById("datos").elements.item(2).value
    			}
    			if (document.getElementById("datos").elements.item(4).value !== ""){
    				dataObj.fechaVcmto = document.getElementById("datos").elements.item(4).value
    			}

			} else if (metodoEjecutar == 'canjePuntosTVirtual' ) {
				if (document.getElementById("datos").elements.item(0).value !== "Tipo de Identificacion"){
					cedula = document.getElementById("datos").elements.item(0).value;
				}			
				cedula = cedula + document.getElementById("datos").elements.item(1).value;
				pan = document.getElementById("datos").elements.item(3).value;
				puntosCanje = document.getElementById("tVirtual").elements.item(3).value;

    			dataObj = {
    					"accion":metodoEjecutar,
    					"cedula": cedula,
    					"numeroTarjeta": pan,

    			}

				}

				pan = document.getElementById("datos").elements.item(3).value;

    				dataObj.fechaVcmto = document.getElementById("datos").elements.item(4).value;
    			}

				}			
				cedula = cedula + document.getElementById("datos").elements.item(1).value;
				pan = document.getElementById("datos").elements.item(3).value;
				montoCompra = document.getElementById("tVirtual").elements.item(12).value;
				tipoMonedero = document.getElementById("tVirtual").elements.item(11).value;

    			dataObj = {
    					"accion":metodoEjecutar,
    					"cedula": cedula,
    					"numeroTarjeta": pan,
    					"saldoPagar": montoCompra,
    					"tipoMonedero": tipoMonedero
    			}
    			if (document.getElementById("datos").elements.item(4).value !== ""){
    				dataObj.fechaVcmto = document.getElementById("datos").elements.item(4).value
    			}
			} else if (metodoEjecutar == 'mantenimientoPINTVirtual') {
				if (document.getElementById("datos").elements.item(0).value !== "Tipo de Identificacion"){
					cedula = document.getElementById("datos").elements.item(0).value;
				}			
				cedula = cedula + document.getElementById("datos").elements.item(1).value;
				pan = document.getElementById("datos").elements.item(3).value;
    			dataObj = {
    					"accion":metodoEjecutar,

    					"numeroTarjeta": pan

    			}

			var dataRequest = JSON.stringify(dataObj, undefined, 4);
			//alert(dataRequest);
			$("#solicitud").val(dataRequest);
			var dataResponse;
			$.ajax({
					url: "http://localhost:8085/vpos/metodo_cards",
					type: 'POST',						
					dataType: 'json',
					contentType: "application/json; charset=utf-8",	
					data: dataRequest,
					success: function (dataResponse) {
						respuesta = JSON.stringify(dataResponse,undefined, 4);
						document.getElementById("respuesta").value =  respuesta;

						var t = JSON.parse(respuesta);

						if (t['numeroTarjeta'] !== ""){
							document.getElementById("datos").elements.item(3).value = t['numeroTarjeta'];
						}

						if (t['fechaExpiracion'] !== ""){
							document.getElementById("datos").elements.item(4).value = t['fechaExpiracion'];
						}

						if (t['listaSaldosPrepago'] !== null){
							var cuentas = JSON.stringify(t['listaSaldosPrepago'],undefined, 4);
							var t2 = JSON.parse(cuentas);

							document.getElementById("tVirtual").elements.item(9).value = "";

							var s=document.getElementById("cuentas");

							for (let i = s.options.length; i >= 1; i--){
								s.remove(i);
							}
							

							var coordenadas;
							for (n in t2) {
								coordenadas = t2[n].toString().split(",");
 								document.getElementById("tVirtual").elements.item(9).value = document.getElementById("tVirtual").elements.item(9).value + coordenadas[0] + ": " + coordenadas[1] + "\n";

 								var option = document.createElement("option");
								option.value=n.toString();
								option.text=coordenadas[0];

								s.appendChild(option) 
 							
 							}
						
						}
						if (t['saldoDisponible'] !== ""){
							var peticion = JSON.stringify(dataObj);
							var peticion2 = JSON.parse(peticion);
							switch (peticion2['accion']){
								case "consultarPuntosTVirtual":
									document.getElementById("tVirtual").elements.item(1).value = t['saldoDisponible'];
								break
								case "consultaDeCardsPrepago":
									document.getElementById("tVirtual").elements.item(9).value = t['saldoDisponible'];
								break
							}
						}
						
						
					}
				});	
				console.log("Fin ")			
			}

		function metodosCards(metodoEjecutar){
			document.getElementById("respuesta").value =  "";
			//alert("He invocado un metodo VPOS REST : " + metodoEjecutar);
			var dataObj;
			var cedula;

			if (document.getElementById("datos").elements.item(0).value !== "Tipo de Identificacion"){
					cedula = document.getElementById("datos").elements.item(0).value;
				}			
				cedula = cedula + document.getElementById("datos").elements.item(1).value;

			if (metodoEjecutar == 'activacionCards') {
				dataObj = {
					"accion":metodoEjecutar
				}
				if (document.getElementById("datos").elements.item(2).value !== ""){
    				dataObj.vtId = document.getElementById("datos").elements.item(2).value;
    			}
			} else {
				dataObj = {
				"accion":metodoEjecutar,
				"cedula":cedula
				}
				if (document.getElementById("datos").elements.item(2).value !== ""){
    				dataObj.vtId = document.getElementById("datos").elements.item(2).value;
    			}
			}
			
			var dataRequest = JSON.stringify(dataObj, undefined, 4);
			var dataResponse;
			var respuesta;
			$("#solicitud").val(dataRequest);
			$.ajax({
				url: "http://localhost:8085/vpos/metodo_cards",
				type: 'POST',						
				dataType: 'json',
				contentType: "application/json; charset=utf-8",	
				data: dataRequest,
				success: function (dataResponse) {
					respuesta = JSON.stringify(dataResponse,undefined, 4);
					document.getElementById("respuesta").value =  respuesta
				},
			    error: function (xhr, ajaxOptions, thrownError) {
			          alert(xhr.status);
			          alert(thrownError);
			    }		
			});	
			console.log("Fin ")			
		}
