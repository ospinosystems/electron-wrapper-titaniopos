		function metodoLysto(metodoEjecutar) {
            document.getElementById("respuesta").value = "";
            var montoCompra, cedula, dataObj, idOrden, numSeqOrden, numFactura;

            if (metodoEjecutar == 'creacionLysto') {
                montoCompra = document.getElementById("lysto").elements.item(0).value;
                cedula = document.getElementById("lysto").elements.item(1).value;
                idOrden = document.getElementById("lysto").elements.item(2).value;
                tipoFinanciamiento = document.getElementById("lysto").elements.item(5).value;
                dataObj = {
                    "accion": metodoEjecutar,
                    "montoTransaccion": montoCompra,
                    "cedula": cedula,
                    "tipoFinanciamiento": tipoFinanciamiento,
                    "idOrden": idOrden
                };
                if (document.getElementById("lysto").elements.item(6).value !== "") {
                    dataObj.terminalVirtual = document.getElementById("lysto").elements.item(6).value;
                }
            } else if (metodoEjecutar == 'confirmacionLysto') {
                montoCompra = document.getElementById("lysto").elements.item(0).value;
                idOrden = document.getElementById("lysto").elements.item(2).value;
                medioPago = document.getElementById("lysto").elements.item(3).value;
                dataObj = {
                    "accion": metodoEjecutar,
                    "montoTransaccion": montoCompra,
                    "idOrden": idOrden,
                    "medioPago": medioPago
                };
                if (document.getElementById("lysto").elements.item(6).value !== "") {
                    dataObj.terminalVirtual = document.getElementById("lysto").elements.item(6).value;
                }
            } else if (metodoEjecutar == 'cancelacionLysto') {
                numSeqOrden = document.getElementById("lysto").elements.item(4).value;
                dataObj = {
                    "accion": metodoEjecutar,
                    "numSeqOrden": numSeqOrden
                };
                if (document.getElementById("lysto").elements.item(6).value !== "") {
                    dataObj.terminalVirtual = document.getElementById("lysto").elements.item(6).value;
                }
            } else if (metodoEjecutar == 'solicitudLysto') {
                montoCompra = document.getElementById("lysto").elements.item(0).value;
                dataObj = {
                    "accion": metodoEjecutar,
                    "montoTransaccion": montoCompra
                };
                if (document.getElementById("lysto").elements.item(6).value !== "") {
                    dataObj.terminalVirtual = document.getElementById("lysto").elements.item(6).value;
                }
            }

            var dataRequest = JSON.stringify(dataObj, undefined, 4);
            $("#solicitud").val(dataRequest);
            $.ajax({
                url: "http://localhost:8085/vpos/metodo_lysto",
                type: 'POST',
                dataType: 'json',
                contentType: "application/json; charset=utf-8",
                data: dataRequest,
                success: function (dataResponse) {
                    var respuesta = JSON.stringify(dataResponse, undefined, 4);
                    document.getElementById("respuesta").value = respuesta;

                    var t = JSON.parse(respuesta);
                    var peticion = JSON.stringify(dataObj);

                    if (t['idOrden'] !== "") {
                        document.getElementById("lysto").elements.item(2).value = t['idOrden'];
                    }

                    if (t['numSeqOrden'] !== "" && t['numSeqOrden'] !== 0) {
                        document.getElementById("lysto").elements.item(4).value = t['numSeqOrden'];
                    }

                    if (metodoEjecutar == "creacionLysto") {
                        if (t['montoTransaccion'] !== "" && t['montoTransaccion'] !== 0) {
                            document.getElementById("lysto").elements.item(0).value = t['montoTransaccion'];
                            document.getElementById("lysto").elements.item(4).value = t['numSeq'];
                        }
                    }

                    // Populate tipoFinanciamiento dropdown for solicitudLysto
                    if (metodoEjecutar == "solicitudLysto" && t['productosDisponibles']) {
                        var select = document.getElementById("tipoFinanciamientoLysto");
                        select.innerHTML = '<option value="">Seleccione financiamiento</option>'; // Reset options
                        for (var key in t['productosDisponibles']) {
                            var option = document.createElement("option");
                            option.value = key;
                            option.text = t['productosDisponibles'][key];
                            select.appendChild(option);
                        }
                    }
                },
                error: function (xhr, ajaxOptions, thrownError) {
                    var errorMsg = `Error: ${xhr.status} - ${thrownError || 'Request failed'}`;
                    document.getElementById("respuesta").value = errorMsg;
                    console.error(errorMsg);
                }
            });
            console.log("Fin ");
        }
