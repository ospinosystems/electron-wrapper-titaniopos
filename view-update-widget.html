<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Paleta del frontend (globals.css, tema oscuro): card oklch(0.2 0 0),
     borde oklch(0.3 0 0), primario NARANJA oklch(0.66 0.22 55), radio 8px. */
  html { margin: 0; height: 100%; background: transparent; }
  body {
    margin: 0; height: 100%; box-sizing: border-box; overflow: hidden; user-select: none;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    padding: 14px 16px;
    -webkit-app-region: drag;
    color: oklch(0.98 0 0);
    background: oklch(0.2 0 0);
    border: 1px solid oklch(0.3 0 0);
    border-radius: 10px;
  }
  .title { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .head .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct { font-size: 12px; font-weight: 600; color: oklch(0.66 0.22 55); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 999px; background: oklch(0.25 0.01 55); overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 999px; background: oklch(0.66 0.22 55); transition: width .25s; }
  .fill.indet { width: 30%; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  .meta { display: flex; justify-content: space-between; font-size: 11px;
    color: oklch(0.65 0.01 55); font-variant-numeric: tabular-nums; }
  .hint { font-size: 11px; line-height: 1.45; color: oklch(0.65 0.01 55); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 700; line-height: 1.1; }
  button {
    -webkit-app-region: no-drag; border: 0; cursor: pointer;
    background: oklch(0.66 0.22 55); color: #ffffff;
    font-family: inherit; font-weight: 600; font-size: 12.5px;
    padding: 9px 14px; border-radius: 8px; white-space: nowrap;
  }
  button:hover { background: oklch(0.72 0.18 55); }
  .hidden { display: none; }
  #err { font-size: 11.5px; line-height: 1.45; color: oklch(0.65 0.18 25); }
</style>
</head>
<body>
  <div class="head">
    <span class="title" id="title">Actualización</span>
    <span class="pct" id="pct"></span>
  </div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="meta" id="meta"><span id="size"></span><span id="speed"></span></div>
  <div class="hint" id="dlHint">La caja sigue funcionando con normalidad mientras se descarga.</div>
  <div class="row hidden" id="stagedRow">
    <div>
      <div class="timer" id="timer">5:00</div>
    </div>
    <button id="btn">Reiniciar ahora</button>
  </div>
  <div class="hint hidden" id="stagedHint">La caja se reiniciará automáticamente al llegar a cero para aplicar la actualización.</div>
  <div id="err" class="hidden"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let tick = null;
  let last = null;
  let speedEma = 0;

  const mb = (b) => (b / 1048576).toLocaleString('es-VE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtClock = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const show = (ids) => {
    for (const id of ['bar', 'meta', 'dlHint', 'stagedRow', 'stagedHint', 'err']) {
      $(id).classList.toggle('hidden', !ids.includes(id));
    }
  };

  window.widget.onState((st) => {
    if (st.mode === 'downloading') {
      $('title').textContent = 'Descargando actualización #' + st.buildNumber;
      show(['bar', 'meta', 'dlHint']);
      if (st.total > 0) {
        const pct = st.got / st.total;
        $('fill').classList.remove('indet');
        $('fill').style.width = Math.round(pct * 100) + '%';
        $('pct').textContent = Math.round(pct * 100) + '%';
        $('size').textContent = mb(st.got) + ' MB de ' + mb(st.total) + ' MB';
        if (last && st.ts > last.ts && st.got >= last.got) {
          const inst = (st.got - last.got) / ((st.ts - last.ts) / 1000);
          speedEma = speedEma ? speedEma * 0.7 + inst * 0.3 : inst;
          $('speed').textContent = mb(speedEma) + ' MB/s';
        }
        last = { got: st.got, ts: st.ts };
      } else {
        $('fill').classList.add('indet');
        $('pct').textContent = '';
        $('size').textContent = 'Conectando…';
        $('speed').textContent = '';
        last = null; speedEma = 0;
      }
    } else if (st.mode === 'staged') {
      $('title').textContent = 'Actualización #' + st.buildNumber + ' lista';
      $('pct').textContent = '';
      show(['stagedRow', 'stagedHint']);
      if (tick) clearInterval(tick);
      const upd = () => { $('timer').textContent = fmtClock(st.deadlineTs - Date.now()); };
      upd();
      tick = setInterval(upd, 250);
    } else if (st.mode === 'error') {
      $('title').textContent = 'Actualización';
      $('pct').textContent = '';
      show(['err']);
      $('err').textContent = 'No se pudo descargar la actualización. Se reintentará automáticamente en unos minutos.';
    }
  });
  $('btn').addEventListener('click', () => window.widget.restartNow());
</script>
</body>
</html>
