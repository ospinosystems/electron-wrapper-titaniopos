<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Tema OSCURO fijo (la caja es oscura; no seguir el tema de Windows). */
  html { margin: 0; height: 100%; background: transparent; padding: 10px; box-sizing: border-box; }
  body {
    margin: 0; height: 100%; box-sizing: border-box; overflow: hidden; user-select: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;
    -webkit-app-region: drag;
    color: #fafafa;
    background: linear-gradient(180deg, #17181c 0%, #101114 100%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .head { display: flex; align-items: center; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex: none;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.7); }
  .dot.pulse { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
  .title { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; letter-spacing: .1px; }
  .pct { font-size: 12.5px; font-weight: 700; color: #22c55e; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #16a34a, #4ade80); transition: width .25s; }
  .fill.indet { width: 30%; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: #9ca3af;
    font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .timer-label { font-size: 11px; color: #9ca3af; }
  .timer { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; line-height: 1.15; }
  button {
    -webkit-app-region: no-drag; border: 0; cursor: pointer;
    background: #22c55e; color: #052e16;
    font-family: inherit; font-weight: 700; font-size: 12.5px;
    padding: 10px 16px; border-radius: 10px;
    box-shadow: 0 2px 10px rgba(34, 197, 94, 0.35);
  }
  button:hover { background: #4ade80; }
  button:active { transform: translateY(1px); }
  .hidden { display: none; }
  #err { font-size: 12px; color: #f87171; }
</style>
</head>
<body>
  <div class="head">
    <span class="dot pulse" id="dot"></span>
    <span class="title" id="title">Actualización</span>
    <span class="pct" id="pct"></span>
  </div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="meta" id="meta"><span id="size"></span><span id="speed"></span></div>
  <div class="row hidden" id="stagedRow">
    <div>
      <div class="timer-label">La caja se reinicia en</div>
      <div class="timer" id="timer">5:00</div>
    </div>
    <button id="btn">Reiniciar ahora</button>
  </div>
  <div id="err" class="hidden"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let tick = null;
  let last = null; // { got, ts } para velocidad
  let speedEma = 0;

  const mb = (b) => (b / 1048576).toLocaleString('es-VE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtClock = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  window.widget.onState((st) => {
    if (st.mode === 'downloading') {
      $('title').textContent = 'Descargando actualización #' + st.buildNumber;
      $('dot').classList.add('pulse');
      $('bar').classList.remove('hidden');
      $('meta').classList.remove('hidden');
      $('stagedRow').classList.add('hidden');
      $('err').classList.add('hidden');
      if (st.total > 0) {
        const pct = st.got / st.total;
        $('fill').classList.remove('indet');
        $('fill').style.width = Math.round(pct * 100) + '%';
        $('pct').textContent = Math.round(pct * 100) + '%';
        $('size').textContent = mb(st.got) + ' MB de ' + mb(st.total) + ' MB';
        if (last && st.ts > last.ts && st.got >= last.got) {
          const inst = (st.got - last.got) / ((st.ts - last.ts) / 1000);
          speedEma = speedEma ? speedEma * 0.7 + inst * 0.3 : inst;
          $('speed').textContent = mb(speedEma) + ' MB/s';
        }
        last = { got: st.got, ts: st.ts };
      } else {
        $('fill').classList.add('indet');
        $('pct').textContent = '';
        $('size').textContent = 'Conectando…';
        $('speed').textContent = '';
        last = null; speedEma = 0;
      }
    } else if (st.mode === 'staged') {
      $('title').textContent = 'Actualización #' + st.buildNumber + ' lista';
      $('dot').classList.remove('pulse');
      $('pct').textContent = '';
      $('bar').classList.add('hidden');
      $('meta').classList.add('hidden');
      $('err').classList.add('hidden');
      $('stagedRow').classList.remove('hidden');
      if (tick) clearInterval(tick);
      const upd = () => { $('timer').textContent = fmtClock(st.deadlineTs - Date.now()); };
      upd();
      tick = setInterval(upd, 250);
    } else if (st.mode === 'error') {
      $('title').textContent = 'Actualización';
      $('dot').classList.remove('pulse');
      $('pct').textContent = '';
      $('bar').classList.add('hidden');
      $('meta').classList.add('hidden');
      $('stagedRow').classList.add('hidden');
      $('err').classList.remove('hidden');
      $('err').textContent = 'No se pudo descargar: ' + (st.message || 'error desconocido');
    }
  });
  $('btn').addEventListener('click', () => window.widget.restartNow());
</script>
</body>
</html>
