# ⚠️ DESACTIVADO desde 2026-08-20: el release pasó a correr en AWS CodeBuild
# (proyecto `titanio-pos-electron-release`, definido en `lib/electron-ci.ts` de
# titanio-pos-infra), con webhook nativo de GitHub y SIN GitHub Actions ni
# CodePipeline de por medio — el mismo patrón que ya usan titaniopos-backend y
# titaniopos-frontend.
#
# Cambia el disparador: antes era `push` de un tag `v*`, ahora es **push a
# main**. La lógica de los steps de abajo se migró 1:1 a `buildspec.yml`, en la
# raíz de este repo:
#   - "Node.js" + "Install dependencies"       → phase `install`
#   - "Align package.json version with git tag" → phase `pre_build`, pero la
#     versión ya NO sale del tag: es `1.0.<nº de commits>` (p.ej. 1.0.198). No
#     se commitea el bump ni se pushea el tag desde el CI — un push de vuelta a
#     main volvería a disparar el webhook (bucle). El tag `v<version>` lo crea
#     GitHub solo al publicar el release.
#   - "Create .env from Variables and Secrets"  → phase `pre_build`
#   - "Build and publish release" (npm run release) → phase `build`
#
# Las Variables/Secrets del repo (TITANIOPOS_URL, TITANIOPOS_JWT_SECRET,
# TITANIOPOS_OPEN_DEVTOOLS_ON_START, TITANIOPOS_DEVTOOLS_PASSWORD) ya no las lee
# GitHub: viven en el secreto `titanio-pos/electron-ci` de AWS Secrets Manager y
# en las env vars del proyecto CodeBuild. GH_TOKEN también sale de ahí (el
# `secrets.GITHUB_TOKEN` automático de Actions no existe fuera de Actions).
#
# Este workflow se deja intacto (no se borra) como:
#   1. Referencia de la lógica original, por si hace falta compararla con el
#      buildspec.
#   2. Respaldo manual: sigue disponible vía workflow_dispatch (pestaña Actions
#      → Run workflow) si CodeBuild no está disponible. Ojo: por esa vía la
#      versión sale de package.json tal cual está commiteada, no del contador.
#
# Para reactivar el trigger automático (y volver a tener DOS releases
# disparándose, Actions + CodeBuild, pisándose los assets del mismo release):
# descomentar el bloque `push` de abajo Y desactivar/borrar el proyecto
# CodeBuild en titanio-pos-infra.

# Compila el .exe en Windows y lo sube a GitHub Releases.
# No necesitas GH_TOKEN en tu máquina.
#
# Forma habitual (sin entrar a Actions):
#   git tag v1.0.1
#   git push origin v1.0.1
# El workflow toma la versión del tag (v1.0.1 → 1.0.1 en package.json solo en CI).
#
# Opcional: Actions → Release Windows → Run workflow (útil para pruebas).
# Si usas solo el botón, sube "version" en package.json antes y haz push.
#
# Valores empaquetados en el .exe (GitHub → Settings → Secrets and variables → Actions):
#   Variables: TITANIOPOS_URL (si no existe → http://localhost:3001)
#              TITANIOPOS_OPEN_DEVTOOLS_ON_START (opcional; si vacío → false en el build)
#   Secrets: TITANIOPOS_JWT_SECRET, TITANIOPOS_DEVTOOLS_PASSWORD (opcional)

name: Release Windows

on:
  workflow_dispatch:
  # Trigger automático DESACTIVADO (ver cabecera). Reactivar sólo si se
  # apaga antes el proyecto CodeBuild, o saldrán dos releases por push.
  # push:
  #   tags:
  #     - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package.json version with git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const f = 'package.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          " "$TAG_VER"

      - name: Create .env from GitHub Variables and Secrets
        shell: pwsh
        env:
          TITANIOPOS_URL_INPUT: ${{ vars.TITANIOPOS_URL }}
          TITANIOPOS_JWT_SECRET: ${{ secrets.TITANIOPOS_JWT_SECRET }}
          TITANIOPOS_OPEN_DEVTOOLS_ON_START: ${{ vars.TITANIOPOS_OPEN_DEVTOOLS_ON_START }}
          TITANIOPOS_DEVTOOLS_PASSWORD: ${{ secrets.TITANIOPOS_DEVTOOLS_PASSWORD }}
        run: |
          $url = $env:TITANIOPOS_URL_INPUT
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = 'http://localhost:3001'
          }
          $jwt = if ($null -eq $env:TITANIOPOS_JWT_SECRET) { '' } else { $env:TITANIOPOS_JWT_SECRET }
          $openDt = $env:TITANIOPOS_OPEN_DEVTOOLS_ON_START
          if ([string]::IsNullOrWhiteSpace($openDt)) {
            $openDt = 'false'
          }
          $dtPwd = if ($null -eq $env:TITANIOPOS_DEVTOOLS_PASSWORD) { '' } else { $env:TITANIOPOS_DEVTOOLS_PASSWORD }
          $content = @(
            "TITANIOPOS_URL=$url"
            "TITANIOPOS_JWT_SECRET=$jwt"
            "TITANIOPOS_OPEN_DEVTOOLS_ON_START=$openDt"
            "TITANIOPOS_DEVTOOLS_PASSWORD=$dtPwd"
          ) -join "`n"
          $content += "`n"
          Set-Content -Path .env -Encoding utf8 -Value $content

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El runner no tiene el repo frontend al lado: la vista horneada se
          # baja del feed (el mismo zip ya publicado que consumen las cajas).
          BUNDLE_FROM_FEED: '1'
        run: npm run release
