# ⚠️ DESACTIVADO desde 2026-08-20: el empaquetado del servidor fiscal standalone
# pasó a correr dentro del mismo build de CodeBuild que publica el instalador
# (phase `post_build` de `buildspec.yml`; proyecto `titanio-pos-electron-release`
# en `lib/electron-ci.ts` de titanio-pos-infra).
#
# El motivo de moverlo y no sólo desactivarlo: este workflow colgaba del push de
# un tag `v*`, y el CI nuevo ya no pushea tags desde git — el tag lo crea GitHub
# al publicar el release, lo que no dispara un evento `push`. Dejarlo como
# estaba habría hecho que el ZIP fiscal dejara de adjuntarse en silencio.
#
# El buildspec corre el mismo `node standalone-fiscal/package-standalone.js` y
# sube el ZIP como asset del release vía la API de GitHub (borrando el asset
# previo del mismo nombre, para que un reintento del mismo commit funcione).
#
# Se deja intacto como referencia y como respaldo manual vía workflow_dispatch.

# Empaqueta el servidor fiscal standalone (Python embebido + fiscal.py) en un
# ZIP y lo adjunta al release correspondiente al tag.
#
# Trigger: igual que release-windows.yml — push de tag v*
# Output:  titaniopos-fiscal-server-vX.Y.Z.zip subido al release.

name: Release Fiscal Server Standalone

on:
  workflow_dispatch:
  # Trigger automático DESACTIVADO (ver cabecera). Reactivar sólo si se
  # apaga antes el proyecto CodeBuild, o saldrán dos releases por push.
  # push:
  #   tags:
  #     - "v*"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Align package.json version with git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const f = 'package.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          " "$TAG_VER"

      - name: Build standalone fiscal server zip
        run: node standalone-fiscal/package-standalone.js

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-standalone/titaniopos-fiscal-server-*.zip
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
